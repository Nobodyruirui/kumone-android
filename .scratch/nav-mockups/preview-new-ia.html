<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Kumone 新导航实拍</title>
<style>
  html, body { margin: 0; padding: 0; background: #d8d8dd; }
  #app { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<!--
  实拍预览：直接跑真 App（不是手画稿）。
  ?drawer=1 —— 顺便把「我的」抽屉打开。
-->
<iframe id="app" src="/www/index.html"></iframe>
<script>
var frame = document.getElementById('app');
function fakeService() {
  var TRACK = { id: 1, name: '黑白', artists: [{ id: 9, name: '方大同' }],
    album: { id: 3, name: '黑白', picUrl: '' }, durationMS: 210000 };
  var PL = { id: 22, name: '深夜 driving', cover: '', creator: { nickname: '我' }, playCount: 1024, trackCount: 18 };
  return {
    isLoggedIn: function () { return Promise.resolve(true); },
    account: function () { return Promise.resolve({ ok: true, data: { userId: 77, nickname: '测试用户', avatarUrl: '', vipType: 1 } }); },
    myPlaylists: function () { return Promise.resolve({ ok: true, data: [PL] }); },
    likedSongs: function () { return Promise.resolve({ ok: true, data: [TRACK, TRACK] }); },
    likedAlbums: function () { return Promise.resolve({ ok: true, data: [] }); },
    cloudSongs: function () { return Promise.resolve({ ok: true, data: [TRACK] }); },
    playRecords: function () { return Promise.resolve({ ok: true, data: [] }); },
    dailyRecommend: function () { return Promise.resolve({ ok: true, data: [TRACK, TRACK, TRACK] }); },
    recommendedPlaylists: function () { return Promise.resolve({ ok: true, data: [] }); },
    toplists: function () { return Promise.resolve({ ok: true, data: [] }); },
    topArtists: function () { return Promise.resolve({ ok: true, data: [] }); },
    newAlbums: function () { return Promise.resolve({ ok: true, data: [] }); }
  };
}
frame.addEventListener('load', function () {
  setTimeout(function () {
    var M = frame.contentWindow.Mobile;
    M.service = fakeService();
    M.actions.refreshAccount();
    // 假服务换上之后重画一次主页：刚才那轮真实请求已经失败并留下错误卡了
    M.state.view = { type: 'home' };
    M.state.history = [];
    M.render();
    setTimeout(function () {
      if (location.search.indexOf('compact=1') >= 0) {
        var main = frame.contentDocument.getElementById('m-main');
        if (main) main.scrollTop = 300;   // 触发吸顶栏的小标题
      }
      if (location.search.indexOf('drawer=1') >= 0) {
        var chip = frame.contentDocument.getElementById('m-mine');
        if (chip) chip.click();
      }
    }, 900);
  }, 500);
});
</script>
</body>
</html>
