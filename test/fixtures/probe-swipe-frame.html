<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>Kumone 左滑返回关键帧</title>
<style>
  body { margin: 0; background: #1c1c1e; font: 13px/1.5 system-ui, sans-serif; color: #e8e8ea; }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 18px; }
  iframe { width: 390px; height: 760px; border: 0; border-radius: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.55); background: #f4f4f6; }
  .cap { margin-top: 10px; font-size: 15px; letter-spacing: .3px; }
</style>
</head>
<body>
<!--
  左滑返回的关键帧取景器：
    ?p=0.45 → 拖到 45% 停住（不松手），Edge headless 截图就是这一帧。
  用法：node test/keyframes.mjs
-->
<div class="wrap">
  <iframe id="app" src="/www/index.html?relay=1"></iframe>
  <div class="cap" id="cap">拖动中…</div>
  <pre id="result" data-result="PENDING" style="display:none">PENDING</pre>
</div>

<script>
var out = document.getElementById('result');
var cap = document.getElementById('cap');
var P = parseFloat(new URLSearchParams(location.search).get('p') || '0.45');
var frame = document.getElementById('app');
var timer = setInterval(function () {
  var W = frame.contentWindow;
  if (!W || !W.Mobile) return;
  clearInterval(timer);
  run(W);
}, 200);

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function run(W) {
  try {
    await wait(3500);                       // 等首页真数据
    W.Mobile.goTab('home');
    await wait(700);
    W.Mobile.nav({ type: 'fm' });           // 进二级页
    await wait(1400);

    var main = W.document.getElementById('m-main');
    function touch(type, x, y) {
      var t = new W.Touch({ identifier: 1, target: main, clientX: x, clientY: y, pageX: x, pageY: y });
      var ev = new W.TouchEvent(type, {
        touches: type === 'touchend' ? [] : [t],
        targetTouches: type === 'touchend' ? [] : [t],
        changedTouches: [t], bubbles: true, cancelable: true
      });
      main.dispatchEvent(ev);
    }
    var x = Math.round(390 * P);
    // 旧版行为对照：底层那一页跟着往右挪 0.3*dx（没有压暗层）
    // —— 中间会露出一条画布灰底，松手后再从左边补进上一页，就是「突兀」的来源。
    var mode = new URLSearchParams(location.search).get('mode') || 'new';
    if (mode === 'old') {
      W.Mobile.slideFollow = function (dx) {
        var root = W.document.getElementById('m-view');
        if (!root) return;
        root.style.willChange = 'transform';
        root.style.transition = 'none';
        root.style.transform = 'translate3d(' + dx + 'px,0,0)';
        root.style.opacity = '1';
        var prev = W.document.getElementById('m-view-prev');
        if (prev && prev.classList.contains('is-active')) {
          prev.style.transform = 'translate3d(' + (dx * 0.3) + 'px,0,0)';
        }
      };
      cap.textContent = '旧版左滑 ' + Math.round(P * 100) + '%（底下那页跟着右移）';
    } else {
      cap.textContent = '新版左滑 ' + Math.round(P * 100) + '%（底下那页原地等着被揭开）';
    }
    touch('touchstart', 6, 420);
    for (var i = 1; i <= 8; i++) {
      touch('touchmove', 6 + Math.round((x - 6) * i / 8), 420);
      await wait(30);
    }
    // **不松手**：停在这一帧
    out.setAttribute('data-result', 'HELD');
    out.textContent = 'HELD';
  } catch (e) {
    out.setAttribute('data-result', 'FAIL');
    out.textContent = String(e && e.message || e);
  }
}
</script>
</body>
</html>
