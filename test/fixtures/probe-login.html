<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Kumone 登录页（只扫码）自检</title>
<style>
  body { font: 13px/1.6 system-ui, sans-serif; margin: 20px; }
  iframe { width: 390px; height: 760px; border: 1px solid #ddd; }
  pre { background: #0a0a0a; color: #e8e8ea; padding: 12px; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  自检探针：登录页 —— **只有扫码**这一条路
  （2026-11-04 决定，见 docs/adr/0005-只保留扫码登录.md）。

  登录的两个通道都换成**假服务**（不打真网络）：
    · qrKey / qrImage / qrCheck —— 假二维码，让扫码流程能被驱动

  断言：
    1. 登录页**没有**账号/密码输入框（密码登录整条移除）
    2. 登录页**没有**「账号登录 / 扫码登录」双 Tab
    3. 显示二维码 + 等待扫码状态
    4. 轮询在跑（二维码状态被反复查询）
    5. 二维码过期 → 有「刷新二维码」按钮
    6. 扫码成功 → 登录成功 → 离开登录页
-->
<iframe id="app" src="/www/index.html"></iframe>
<pre id="result" data-result="PENDING">PENDING</pre>

<script>
var out = document.getElementById('result');
var failures = [];
var caught = [];
function ok(name, cond, extra) {
  if (!cond) failures.push(name + (extra ? ' :: ' + extra : ''));
}
function finish() {
  var okAll = failures.length === 0;
  out.setAttribute('data-result', okAll ? 'PASS' : 'FAIL');
  out.textContent = (okAll ? 'PASS ' : 'FAIL ') +
    (okAll ? '扫码登录自检通过' : ('失败项：' + failures.join('；'))) +
    (caught.length ? (' | 运行时错误：' + caught.slice(0, 4).join(' | ')) : '');
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var frame = document.getElementById('app');
frame.addEventListener('load', function () { setTimeout(run, 800); });

window.addEventListener('error', function (e) { caught.push('window error: ' + (e.message || '')); });
window.addEventListener('unhandledrejection', function (e) {
  caught.push('unhandled rejection: ' + ((e.reason && e.reason.message) || e.reason));
});

async function run() {
  try {
    var W = frame.contentWindow;
    var M = W.Mobile;
    var doc = W.document;
    W.addEventListener('error', function (e) {
      caught.push('iframe error: ' + (e.message || ''));
    });

    /* -------------------- 假服务 -------------------- */

    var qrChecks = 0;
    var qrKeys = 0;
    var phase = 'waiting';           // waiting → expired → waiting → success
    M.service.isLoggedIn = function () { return Promise.resolve(false); };
    M.service.account = function () { return Promise.resolve({ ok: false, code: 'KUMONE_NEED_LOGIN' }); };
    M.service.qrKey = function () { qrKeys++; return Promise.resolve({ ok: true, data: 'fake-unikey' }); };
    M.service.qrImage = function () { return Promise.resolve({ ok: true, data: 'data:image/gif;base64,R0lGOD' }); };
    M.service.qrCheck = function () {
      qrChecks++;
      return Promise.resolve({ ok: true, data: { code: phase === 'success' ? 803 : (phase === 'expired' ? 800 : 801) } });
    };

    /* -------------------- 1. 进登录页 -------------------- */

    M.nav({ type: 'login' });
    await wait(900);

    ok('进了登录页', M.state.view.type === 'login', M.state.view.type);

    /* -------------------- 2. 密码登录的痕迹全没了 -------------------- */

    ok('没有账号输入框', doc.querySelectorAll('#m-view input[aria-label="手机号或邮箱"]').length === 0);
    ok('没有密码输入框', doc.querySelectorAll('#m-view input[type="password"]').length === 0);
    ok('没有「账号登录」Tab', doc.querySelectorAll('#m-view [role="tab"][aria-label="账号登录"]').length === 0);
    ok('没有「扫码登录」Tab（只剩一种方式，Tab 没有意义）',
      doc.querySelectorAll('#m-view [role="tab"]').length === 0);
    ok('页面上没有「密码」两个字',
      doc.getElementById('m-view').textContent.indexOf('密码') < 0,
      doc.getElementById('m-view').textContent.slice(0, 120));

    /* -------------------- 3. 二维码 + 状态 -------------------- */

    ok('显示二维码', doc.querySelectorAll('#m-view .m-login-code').length === 1);
    var status = doc.querySelector('#m-view .m-login-status');
    ok('显示扫码状态文案', !!status && status.textContent.length > 0,
      status ? status.textContent : '（无）');

    /* -------------------- 4. 轮询在跑 -------------------- */

    await wait(2600);
    ok('二维码状态被反复查询（轮询在跑）', qrChecks >= 1, 'qrCheck 调用 ' + qrChecks + ' 次');

    /* -------------------- 5. 过期 → 刷新按钮 -------------------- */

    phase = 'expired';
    await wait(2400);
    var refreshBtn = doc.querySelector('#m-view button[aria-label="刷新二维码"]');
    ok('二维码过期后有「刷新二维码」按钮', !!refreshBtn);
    if (refreshBtn) {
      // 先把服务端状态切回「等待扫码」，再点刷新 ——
      // 不然刷新后的下一次轮询又会把二维码问成「已过期」，
      // 而机器在 expired 相位是不轮询的（这正是它该有的行为）。
      phase = 'waiting';
      var keysBefore = qrKeys;
      refreshBtn.click();
      await wait(900);
      ok('点刷新会重新取二维码', qrKeys > keysBefore, 'qrKey ' + keysBefore + ' → ' + qrKeys);
      await wait(2200);
      var stAfter = doc.querySelector('#m-view .m-login-status');
      ok('点刷新后回到「等待扫码」',
        stAfter && stAfter.textContent.indexOf('等待扫码') >= 0,
        (stAfter ? stAfter.textContent : '（无状态）') +
        ' | 面板数=' + doc.querySelectorAll('#m-view .m-login-panel').length +
        ' | 状态数=' + doc.querySelectorAll('#m-view .m-login-status').length);
    }

    /* -------------------- 6. 扫码成功 → 离开登录页 -------------------- */

    phase = 'success';
    // 「登录成功」只显示 600ms 就跳走 —— 得盯着看，别等固定时长
    var sawSuccess = false;
    for (var i = 0; i < 30; i++) {
      await wait(200);
      if (doc.getElementById('m-view').textContent.indexOf('登录成功') >= 0) { sawSuccess = true; break; }
    }
    ok('扫码成功后显示「登录成功」', sawSuccess,
      doc.getElementById('m-view').textContent.slice(0, 100));
    await wait(900);
    ok('登录成功后离开登录页', M.state.view.type !== 'login', M.state.view.type);

    finish();
  } catch (e) {
    failures.push('异常：' + (e && e.message ? e.message : String(e)));
    finish();
  }
}
</script>
</body>
</html>
