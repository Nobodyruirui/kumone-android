<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Kumone 返回手势自检</title>
<style>
  body { font: 13px/1.6 system-ui, sans-serif; margin: 20px; }
  iframe { width: 390px; height: 760px; border: 1px solid #ddd; }
  pre { background: #0a0a0a; color: #e8e8ea; padding: 12px; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  自检探针：返回手势与转场（.scratch/phone-fixes/issues/05-swipe-back-transition）。

  断言：
    1. 前进时旧内容被搬进「上一层」容器（转场真的发生了，不是硬切）
    2. 从左边缘右滑 → 回到上一页
    3. 滑得不够 → 弹回原位，页面不变
    4. 顶栏返回箭头仍然能返回
    5. 没有返回历史时不启用边缘手势
-->
<iframe id="app" src="/www/index.html"></iframe>
<pre id="result" data-result="PENDING">PENDING</pre>

<script>
var out = document.getElementById('result');
var failures = [];
var caught = [];
function ok(name, cond, extra) {
  if (!cond) failures.push(name + (extra ? ' :: ' + extra : ''));
}
function finish() {
  var okAll = failures.length === 0;
  out.setAttribute('data-result', okAll ? 'PASS' : 'FAIL');
  out.textContent = (okAll ? 'PASS ' : 'FAIL ') +
    (okAll ? '返回手势自检通过' : ('失败项：' + failures.join('；'))) +
    (caught.length ? (' | 运行时错误：' + caught.slice(0, 4).join(' | ')) : '');
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var frame = document.getElementById('app');
frame.addEventListener('load', function () { setTimeout(run, 800); });

window.addEventListener('error', function (e) {
  caught.push('window error: ' + (e.message || ''));
});
window.addEventListener('unhandledrejection', function (e) {
  caught.push('unhandled rejection: ' + ((e.reason && e.reason.message) || e.reason));
});

async function run() {
  try {
    var W = frame.contentWindow;
    var M = W.Mobile;
    var doc = W.document;
    W.addEventListener('error', function (e) {
      caught.push('iframe error: ' + (e.message || ''));
    });

    /* -------------------- 造一个触摸事件 -------------------- */

    function touch(el, type, x, y) {
      var t = new W.Touch({
        identifier: 1, target: el, clientX: x, clientY: y, pageX: x, pageY: y
      });
      var ev = new W.TouchEvent(type, {
        touches: type === 'touchend' ? [] : [t],
        targetTouches: type === 'touchend' ? [] : [t],
        changedTouches: [t],
        bubbles: true,
        cancelable: true
      });
      el.dispatchEvent(ev);
    }

    var main = doc.getElementById('m-main');

    /* -------------------- 1. 前进有转场 -------------------- */

    M.goTab('home');
    await wait(300);
    M.nav({ type: 'fm' });
    await wait(80);
    ok('前进后进入广播页', M.state.view.type === 'fm', M.state.view.type);
    ok('前进时旧内容搬进了上一层容器', !!doc.getElementById('m-view-prev'));
    await wait(500);

    /* -------------------- 2. 边缘左滑返回 -------------------- */

    ok('返回前有历史', M.state.history.length === 1, 'history=' + M.state.history.length);
    touch(main, 'touchstart', 6, 400);
    touch(main, 'touchmove', 60, 402);
    touch(main, 'touchmove', 200, 404);
    touch(main, 'touchend', 200, 404);
    await wait(800);
    ok('左滑后回到上一页', M.state.view.type === 'home', M.state.view.type);
    ok('左滑后历史被弹出', M.state.history.length === 0, 'history=' + M.state.history.length);

    /* -------------------- 3. 滑不够就弹回 -------------------- */

    M.nav({ type: 'fm' });
    await wait(600);
    touch(main, 'touchstart', 6, 400);
    touch(main, 'touchmove', 30, 401);
    touch(main, 'touchend', 30, 401);
    await wait(700);
    ok('滑不够时留在原页面', M.state.view.type === 'fm', M.state.view.type);
    ok('滑不够时历史没变', M.state.history.length === 1, 'history=' + M.state.history.length);

    /* -------------------- 4. 顶栏返回箭头 -------------------- */

    var backBtn = doc.getElementById('m-back');
    ok('顶栏有返回箭头', !!backBtn);
    backBtn.click();
    await wait(700);
    ok('点箭头回到上一页', M.state.view.type === 'home', M.state.view.type);

    /* -------------------- 5. 没有历史时手势不启用 -------------------- */

    ok('现在没有返回历史了', M.state.history.length === 0);
    touch(main, 'touchstart', 6, 400);
    touch(main, 'touchmove', 200, 402);
    touch(main, 'touchend', 200, 402);
    await wait(600);
    ok('没有历史时左滑不改变页面', M.state.view.type === 'home', M.state.view.type);

    finish();
  } catch (e) {
    failures.push('异常：' + (e && e.message ? e.message : String(e)));
    finish();
  }
}
</script>
</body>
</html>
