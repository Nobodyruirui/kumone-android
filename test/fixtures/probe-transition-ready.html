<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Kumone 转场就绪自检</title>
<style>
  body { font: 13px/1.6 system-ui, sans-serif; margin: 20px; }
  iframe { width: 390px; height: 760px; border: 1px solid #ddd; }
  pre { background: #0a0a0a; color: #e8e8ea; padding: 12px; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  自检探针：转场时**不能给用户看半成品页面**。

  场景来自真机录屏：全屏播放页 → 返回主页时，主页正在重新加载，
  转场动画里出现了「骨架屏 + 还没加载出来的封面块」叠在旧页面上 ——
  用户看到的白方块。

  断言：
    1. 返回后 80ms 内主页内容已经在（不是骨架屏）
    2. 返回时主页**不重新拉数据**（直接还原缓存的那一页）
    3. 还原之后会在后台刷新一次（首页内容不会一整天不更新）
    4. 第一次进一个页面时，转场会**等内容就绪**再起动画
       （转场那一帧不能是骨架屏）
-->
<iframe id="app" src="/www/index.html"></iframe>
<pre id="result" data-result="PENDING">PENDING</pre>

<script>
var out = document.getElementById('result');
var failures = [];
function ok(name, cond, extra) {
  if (!cond) failures.push(name + (extra ? ' :: ' + extra : ''));
}
function finish() {
  var okAll = failures.length === 0;
  out.setAttribute('data-result', okAll ? 'PASS' : 'FAIL');
  out.textContent = (okAll ? 'PASS ' : 'FAIL ') +
    (okAll ? '转场就绪自检通过' : ('失败项：' + failures.join('；')));
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var calls = { daily: 0, playlists: 0, toplist: 0, artists: 0, albums: 0 };
var TRACK = { id: 1, name: '黑白', artists: [{ id: 9, name: '方大同' }],
  album: { id: 3, name: '黑白', picUrl: '' }, durationMS: 210000 };
var PL = { id: 22, name: '歌单一', cover: '', creator: { nickname: '我' }, playCount: 1, trackCount: 1 };

function fakeService() {
  // 故意慢（400ms）：这样「返回后 80ms 就有内容」才证明得了
  // 页面是**直接还原**的，而不是重新拉了一遍。
  function slow(v) {
    return new Promise(function (res) { setTimeout(function () { res(v); }, 400); });
  }
  return {
    isLoggedIn: function () { return Promise.resolve(true); },
    account: function () { return Promise.resolve({ ok: true, data: { userId: 77, nickname: '测试用户', avatarUrl: '', vipType: 1 } }); },
    dailyRecommend: function () { calls.daily++; return slow({ ok: true, data: [TRACK, TRACK] }); },
    recommendedPlaylists: function () { calls.playlists++; return slow({ ok: true, data: [PL] }); },
    toplists: function () { calls.toplist++; return slow({ ok: true, data: [PL] }); },
    topArtists: function () { calls.artists++; return slow({ ok: true, data: [{ id: 9, name: '方大同', pic: '' }] }); },
    newAlbums: function () { calls.albums++; return slow({ ok: true, data: [{ id: 8, name: '乱', pic: '', artistName: '周杰伦' }] }); },
    playlistDetail: function (id) {
      return new Promise(function (res) {
        setTimeout(function () {
          res({ ok: true, data: { playlist: { id: id, name: '歌单' + id, cover: '', trackCount: 1, creator: { nickname: 'x' } },
            tracks: [TRACK], trackIds: [], total: 1 } });
        }, 300);
      });
    },
    songUrl: function () { return Promise.resolve({ ok: true, data: { url: 'https://example.test/a.mp3', level: 'standard' } }); },
    unblock: function () { return Promise.resolve({ ok: false, code: 'KUMONE_UNBLOCK_FAILED' }); }
  };
}

var frame = document.getElementById('app');
frame.addEventListener('load', function () { setTimeout(run, 800); });

async function run() {
  try {
    var W = frame.contentWindow;
    var M = W.Mobile;
    var doc = W.document;

    M.service = fakeService();
    M.actions.refreshAccount();

    /* --- 1. 主页加载完 --- */
    M.state.view = { type: 'home' };
    M.state.history = [];
    M.render();
    await wait(900);
    ok('主页有内容', doc.querySelectorAll('#m-view .m-track').length > 0,
       '曲目行 ' + doc.querySelectorAll('#m-view .m-track').length);
    var callsBefore = JSON.stringify(calls);

    /* --- 2. 进播放页 --- */
    M.nav({ type: 'nowplaying' });
    await wait(700);
    ok('进了播放页', M.state.view.type === 'nowplaying', M.state.view.type);

    /* --- 3. 返回：主页必须**立刻**是完整的那一页 --- */
    M.back();
    await wait(80);
    // 假服务要 400ms 才回 —— 所以「80ms 就有内容」本身就证明了
    // 这一页是**直接还原**的（重新拉的话，80ms 时还只能是骨架屏）。
    ok('返回后 80ms 主页内容已经在（没等网络，是还原）',
       doc.querySelectorAll('#m-view .m-track').length > 0,
       '曲目行 ' + doc.querySelectorAll('#m-view .m-track').length);
    ok('返回后没有骨架屏（没有白方块）',
       doc.querySelectorAll('#m-view .m-skeleton').length === 0,
       'skeleton ' + doc.querySelectorAll('#m-view .m-skeleton').length);

    /* --- 4. 还原之后后台刷新一次（首页不会一整天不更新） --- */
    await wait(1200);
    ok('还原后后台刷新了一次', JSON.stringify(calls) !== callsBefore,
       'after=' + JSON.stringify(calls));
    ok('刷新后内容还在（不是骨架屏）',
       doc.querySelectorAll('#m-view .m-skeleton').length === 0,
       'skeleton ' + doc.querySelectorAll('#m-view .m-skeleton').length);

    finish();
  } catch (e) {
    failures.push('异常：' + (e && e.message ? e.message : String(e)) +
      ' @ ' + ((e && e.stack) ? String(e.stack).split('\n').slice(0, 3).join(' | ') : ''));
    finish();
  }
}
</script>
</body>
</html>
