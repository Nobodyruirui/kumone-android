<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: http: data: blob:; media-src 'self' https: http: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://music.163.com https://interface.music.163.com https://api.github.com https: http:; font-src 'self' https:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f6">
  <title>Kumone</title>

  <!-- 移动端渲染层 -->
  <link rel="stylesheet" href="mobile/css/tokens.css">
  <link rel="stylesheet" href="mobile/css/shell.css">
</head>
<body>
  <div id="m-app">
    <main id="m-main" aria-label="内容">
      <div id="m-view" role="region" aria-label="当前页面"></div>
    </main>
  </div>

  <!-- 内核层：加密 / 请求 / 接口封装 / 音源解锁 / 原生桥 -->
  <script src="vendor/crypto-js.js"></script>
  <script src="kumone/lib/crypto.js"></script>
  <script src="kumone/lib/client.js"></script>
  <script src="kumone/lib/api.js"></script>
  <script src="kumone/lib/unblock.js"></script>
  <script src="vendor/qrcode.bundle.js"></script>
  <script src="kumone/bridge.js"></script>

  <!-- 共享归一化纯函数（渲染层共享区，浏览器 + Node 双载） -->
  <script src="shared/normalize.js"></script>

  <!-- 移动端渲染层：契约 → 外壳 → 路由 → 视图 → 启动 -->
  <script src="mobile/core/errors.js"></script>
  <script src="mobile/core/service.js"></script>
  <script src="mobile/core/ui.js"></script>
  <script src="mobile/core/actions.js"></script>
  <script src="mobile/core/shell.js"></script>
  <script src="mobile/core/router.js"></script>
  <script src="mobile/core/gesture.js"></script>
  <script src="mobile/core/snapshot.js"></script>
  <script src="mobile/core/player.js"></script>
  <script src="mobile/core/login.js"></script>
  <script src="mobile/core/lyrics.js"></script>

  <!-- 知识包：稳定定位器（按 manifest.loadOrder：locator → playlist → playback） -->
  <script src="mobile/learnings/netease/tools/locator.js"></script>
  <script src="mobile/learnings/netease/tools/playlist.js"></script>
  <script src="mobile/learnings/netease/tools/playback.js"></script>

  <script src="mobile/views/home.js"></script>
  <script src="mobile/views/detail.js"></script>
  <script src="mobile/views/nowplaying.js"></script>
  <script src="mobile/views/login.js"></script>
  <script src="mobile/views/library.js"></script>
  <script src="mobile/views/mylist.js"></script>
  <script src="mobile/views/fm.js"></script>
  <script src="mobile/views/search.js"></script>
  <script src="mobile/app.js"></script>
</body>
</html>
